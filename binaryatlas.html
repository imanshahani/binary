<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinite Binary Atlas: Cinematic Explorer</title>
    <style>
        :root {
            --bg: #1a1a1a; 
            --text: #e0e0e0;
            --primary-ui: #00ff66; --complement-ui: #00ccff; --family-ui: #ff00ff;
        }

        body {
            margin: 0; overflow: hidden; background-color: var(--bg); color: var(--text);
            font-family: 'Segoe UI', monospace; user-select: none;
            -webkit-user-select: none;
        }

        canvas { display: block; touch-action: none; cursor: crosshair; }

        /* Floating HUD UI */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; padding: 20px; box-sizing: border-box;
            transition: opacity 0.3s ease;
        }
        #ui-layer.collapsed {
            opacity: 0;
            visibility: hidden;
        }

        #ui-layer.collapsed .hud-panel {
            pointer-events: none; /* Prevents invisible buttons from being clicked */
        }

        .hud-panel {
            pointer-events: auto;
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        /* New Bottom Bar Container */
        #bottom-bar {
            position: absolute; bottom: 20px; left: 20px; right: 20px;
            display: flex; gap: 10px; z-index: 2000; align-items: stretch;
            pointer-events: none;
        }
        #bottom-bar > * {
            pointer-events: auto;
        }

        #btn-toggle-ui {
            display: block; 
            font-size: 1.2rem; padding: 10px 15px; 
            color: #fff; background: rgba(15, 15, 15, 0.9);
            border: 1px solid rgba(255,255,255,0.2); cursor: pointer; border-radius: 8px;
            white-space: nowrap; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }

        #controls-panel {
            position: absolute; top: 20px; left: 20px;
            width: 320px; padding: 20px;
            display: flex; flex-direction: column; gap: 15px;
            box-sizing: border-box;
        }

        #waveform-panel {
            position: absolute; bottom: 80px; right: 20px;
            width: 400px; height: 160px; padding: 15px;
            display: flex; flex-direction: column; gap: 10px;
            transition: opacity 0.3s; box-sizing: border-box;
        }

        .control-group { display: flex; flex-direction: column; gap: 8px; }

        button {
            background: rgba(255, 255, 255, 0.05); color: #aaa; border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 16px; cursor: pointer; font-family: inherit; 
            text-transform: uppercase; font-weight: bold; font-size: 0.75rem;
            border-radius: 4px; transition: all 0.2s; touch-action: manipulation;
        }

        button:hover:not(:disabled), button:active:not(:disabled) { color: #fff; background: rgba(255, 255, 255, 0.1); border-color: rgba(255,255,255,0.3); }
        button:disabled { opacity: 0.3; cursor: not-allowed; }
        
        #btn-mode-genealogy.active { background: rgba(0, 255, 102, 0.15); border-color: var(--primary-ui); color: var(--primary-ui); }
        #btn-mode-linear.active { background: rgba(0, 204, 255, 0.15); border-color: var(--complement-ui); color: var(--complement-ui); }
        #btn-mode-family.active { background: rgba(255, 0, 255, 0.15); border-color: var(--family-ui); color: var(--family-ui); }
        #btn-toggle-sankey.active { background: rgba(255,255,255,0.2); color: #fff; border-color: #fff; }
        #btn-open-branch { background: rgba(255, 255, 255, 0.05); border-color: rgba(255,255,255,0.3); color: #fff; }

        #stats-panel {
            background: rgba(0,0,0,0.6); padding: 12px; border-left: 3px solid #fff; border-radius: 4px;
            display: flex; flex-direction: column; gap: 6px; font-size: 0.8rem;
        }
        .stat-row { display: flex; justify-content: space-between; }
        .stat-val { font-weight: bold; color: #fff; }

        .search-container { 
            display: flex; gap: 0; background: rgba(15, 15, 15, 0.9); 
            border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; 
            overflow: hidden; flex-grow: 1; 
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .search-container input {
            background: transparent; color: #fff; border: none; padding: 10px 12px;
            font-family: monospace; font-size: 16px; outline: none; width: 100%;
        }
        .search-container button { 
            background: rgba(255,255,255,0.05); color: #aaa; border: none; 
            border-left: 1px solid rgba(255,255,255,0.1); border-radius: 0; 
            padding: 10px 16px; cursor: pointer; font-weight: bold; font-family: inherit;
        }
        .search-container button:hover:not(:disabled) {
            color: #fff; background: rgba(255,255,255,0.1);
        }

        .gap-controls {
            display: flex; align-items: center; justify-content: space-between; 
            background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden;
            height: 36px; margin-top: 5px;
        }
        .gap-controls button { border: none; border-radius: 0; height: 100%; background: transparent; padding: 0 15px; }
        .gap-controls button:hover { background: rgba(255,255,255,0.1); }
        .gap-controls input {
            background: transparent; color: #fff; border: none; text-align: center;
            width: 100%; font-family: monospace; font-size: 16px; outline: none;
        }

        #waveform-canvas { width: 100%; flex-grow: 1; image-rendering: pixelated; }
        #waveform-label { font-size: 0.7rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }

        #tooltip {
            position: absolute; display: none; background: rgba(10, 10, 10, 0.95);
            border: 1px solid rgba(255,255,255,0.15); padding: 15px; border-radius: 6px; 
            pointer-events: none; box-shadow: 0 8px 30px rgba(0,0,0,0.8); z-index: 1000;
        }
        
        .tt-grid { display: grid; grid-template-columns: auto 1fr; gap: 5px 15px; font-size: 0.85rem; align-items: start; }
        .tt-label { color: #888; white-space: nowrap; }
        .tt-val { color: #fff; font-family: monospace; word-break: break-all; }
        
        #tt-family { font-weight: bold; color: var(--family-ui); }
        
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        /* Branch View Modal */
        #branch-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 15, 15, 0.95); z-index: 4000;
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            display: flex; flex-direction: column; padding: 20px; box-sizing: border-box;
            overflow-y: auto;
        }
        .branch-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; margin-bottom: 20px; }
        .branch-header h2 { margin: 0; font-size: 1.2rem; color: var(--family-ui); text-transform: uppercase; letter-spacing: 2px;}
        .branch-controls { display: flex; gap: 10px; }
        .branch-controls input {
            flex-grow: 1; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; padding: 12px; border-radius: 6px; font-family: monospace; font-size: 1rem; outline: none;
            width: 100%; box-sizing: border-box;
        }
        .branch-controls button { background: rgba(255, 0, 255, 0.15); border-color: var(--family-ui); color: var(--family-ui); padding: 12px 20px; }
        
        .branch-list { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        
        .branch-item {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
            padding: 12px 15px; border-radius: 6px; display: flex; flex-direction: column;
            font-family: monospace; font-size: 0.9rem;
        }
        .branch-main-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .branch-future-row { 
            font-size: 0.8rem; color: #aaa; margin-top: 8px; padding-top: 8px; 
            border-top: 1px dashed rgba(255,255,255,0.15); width: 100%; text-align: left; 
        }
        .branch-future-label { color: var(--complement-ui); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; font-size: 0.7rem; margin-right: 5px; }
        
        .branch-bin { color: #fff; letter-spacing: 1px;}
        .branch-math { color: var(--primary-ui); font-weight: bold; }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            #tooltip {
                position: fixed !important; top: 0 !important; left: 0 !important;
                width: 100% !important; border-radius: 0 !important;
                border-width: 0 0 1px 0 !important;
                display: block !important;
                padding: 10px 15px !important; box-sizing: border-box; z-index: 3000;
                backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            }
            .tt-grid { 
                grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 0.75rem; 
            }
            
            #bottom-bar { bottom: 15px; left: 15px; right: 15px; }
            #ui-layer.collapsed { display: none; }
            #controls-panel { top: 60px; left: 15px; right: 15px; width: auto; max-height: 50vh; overflow-y: auto; }
            #waveform-panel { bottom: 80px; left: 15px; right: 15px; width: auto; height: 120px; }
            
            .branch-controls { flex-direction: column; }
            .branch-main-row { flex-direction: column; align-items: flex-start; gap: 5px; }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            #tooltip {
                position: fixed !important; top: 0 !important; left: 0 !important;
                width: 100% !important; border-radius: 0 !important;
                border-width: 0 0 1px 0 !important; display: block !important;
                padding: 5px 15px !important; box-sizing: border-box; z-index: 3000;
                backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            }
            .tt-grid { grid-template-columns: auto 1fr auto 1fr; gap: 2px 10px; font-size: 0.7rem; }
            
            #bottom-bar { bottom: 10px; left: 10px; right: 10px; }
            #ui-layer.collapsed { display: none; }
            #controls-panel { top: 40px; left: 10px; width: 300px; max-height: calc(100vh - 100px); overflow-y: auto; padding: 15px; }
            #waveform-panel { bottom: 70px; right: 10px; top: auto; width: 300px; height: 100px; padding: 10px; }
        }
    </style>
</head>
<body>

    <div id="bottom-bar">
        <button id="btn-toggle-ui">☰ Menu</button>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search Dec or Bin...">
            <button id="btn-search" title="Focus Selection">GO</button>
            <button id="btn-ancestor" disabled title="Go up to immediate Ancestor">⬆</button>
        </div>
    </div>

    <div id="ui-layer">
        <div id="controls-panel" class="hud-panel">
            <div id="stats-panel">
                <div class="stat-row"><span>Zoom:</span> <span id="debug-zoom" class="stat-val">1.0x</span></div>
                <div class="stat-row"><span>Depth:</span> <span id="debug-depth" class="stat-val">-</span></div>
            </div>
            <div class="control-group">
                <button id="btn-mode-linear" class="active">Complement Descent</button>
                <button id="btn-mode-genealogy">Dynamic Genealogy & Siblings</button>
                <button id="btn-mode-family">Family Atlas Colors</button>
                <button id="btn-open-branch">Open Branch View</button>
            </div>
            <div class="control-group">
                <button id="btn-toggle-sankey" class="active">Toggle Sankey Flow</button>
                <div class="gap-controls">
                    <button id="btn-gap-dec">-</button>
                    <input type="number" id="gapInput" min="0" max="256" value="0" title="Column Gap (px)">
                    <button id="btn-gap-inc">+</button>
                </div>
            </div>
        </div>

        <div id="waveform-panel" class="hud-panel">
            <div id="waveform-label">Structural Complexity (Runs / Depth)</div>
            <canvas id="waveform-canvas"></canvas>
        </div>
    </div>

    <div id="branch-modal" style="display: none;">
        <div class="branch-header">
            <h2>Family Branch View</h2>
            <button id="btn-close-branch">✕ Close</button>
        </div>
        <div class="branch-controls">
            <input type="text" id="branch-root-input" placeholder="Enter alternating root (e.g., 1010)">
            <button id="btn-calc-branch">Calculate Branches</button>
        </div>
        <div id="branch-error" style="color: #ff3333; margin-top: 10px; font-size: 0.85rem;"></div>
        <div id="branch-results"></div>
    </div>

    <div id="tooltip">
        <div class="tt-grid">
            <div class="tt-label">Depth:</div> <div id="tt-depth" class="tt-val" style="color:#00ff66;">-</div>
            <div class="tt-label">Integer:</div> <div id="tt-int" class="tt-val">-</div>
            <div class="tt-label">Binary:</div> <div id="tt-bin" class="tt-val">-</div>
            <div class="tt-label">Ancestor:</div> <div id="tt-family" class="tt-val">-</div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        // --- INFINITE PRECISION CONSTANTS ---
        const BASE_SIZE = 1000;
        const P_BITS = 200n; 
        const P_MULT = 1n << P_BITS;

        // --- BAYER DITHERING ENGINE ---
        const bayer8x8 = [
             0, 32,  8, 40,  2, 34, 10, 42,
            48, 16, 56, 24, 50, 18, 58, 26,
            12, 44,  4, 36, 14, 46,  6, 38,
            60, 28, 52, 20, 62, 30, 54, 22,
             3, 35, 11, 43,  1, 33,  9, 41,
            51, 19, 59, 27, 49, 17, 57, 25,
            15, 47,  7, 39, 13, 45,  5, 37,
            63, 31, 55, 23, 61, 29, 53, 21
        ];

        const patternCache = new Map();

        // --- STATE ---
        const state = {
            width: window.innerWidth, height: window.innerHeight,
            camX_frac: P_MULT * 50n / 1000n, camY_frac: P_MULT / 2n, zoom: 1, gapPx: 0
        , 
            
            // Pointer & Multi-Touch State
            pointers: [], isDragging: false, hasMoved: false, 
            lastMouse: { x: 0, y: 0 }, mouse: { x: 0, y: 0 },
            dragStartX: 0, dragStartY: 0,
            lastPinchDist: null, lastMidpoint: null,
            
            hovered: null, mode: 'linear', showLines: true,
            nodeCache: new Map(), linearEdges: [], waveform: [],
            activeRootRuns: null, activeCompRuns: null, activeRoot: null,
            activeRootIdeal: null, activeCompIdeal: null
        };

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        ctx.imageSmoothingEnabled = false; 

        const waveCanvas = document.getElementById('waveform-canvas');
        const waveCtx = waveCanvas.getContext('2d');

        // --- CORE MATH MAPPING ---
        function getColXFrac(d) { return d <= 1 ? 0n : P_MULT - (P_MULT >> BigInt(d - 1)); }
        function getBlockYFrac(val, d) { return BigInt(val) * (P_MULT >> BigInt(d)); }
        function getBlockSizeFrac(d) { return P_MULT >> BigInt(d); }
        
        function fracToScreenX(frac) {
            let diff = Number(frac - state.camX_frac) / Number(P_MULT);
            return (state.width / 2) + diff * BASE_SIZE * state.zoom;
        }
        function fracToScreenY(frac) {
            let diff = Number(frac - state.camY_frac) / Number(P_MULT);
            return (state.height / 2) + diff * BASE_SIZE * state.zoom;
        }
        function sizeToScreen(frac) { return (Number(frac) / Number(P_MULT)) * BASE_SIZE * state.zoom; }
        
        function applyOffset(baseFrac, pxDiff) {
            let divisorBig = BigInt(Math.floor(BASE_SIZE * state.zoom));
            if (divisorBig === 0n) divisorBig = 1n; 
            let offsetBig = (BigInt(Math.round(pxDiff)) * P_MULT) / divisorBig;
            return baseFrac + offsetBig;
        }

        function screenYToFrac(sy) { return applyOffset(state.camY_frac, sy - (state.height / 2)); }

        function getScreenXInfo(screenX) {
            let d = 1;
            while (d < 1000) {
                let sX = fracToScreenX(getColXFrac(d)) + (d - 1) * state.gapPx;
                let sW = sizeToScreen(getBlockSizeFrac(d));
                if (screenX <= sX + sW) {
                    return { frac: applyOffset(getColXFrac(d), screenX - sX), d: d };
                }
                d++;
            }
            return { frac: getColXFrac(1000), d: 1000 };
        }

        function getScreenPos(d, val) {
            let cxFrac = getColXFrac(d); let cyFrac = getBlockYFrac(val, d); let sizeFrac = getBlockSizeFrac(d);
            let sX = fracToScreenX(cxFrac) + (d - 1) * state.gapPx;
            return { x: sX + sizeToScreen(sizeFrac)/2, y: fracToScreenY(cyFrac + sizeFrac/2n), size: sizeToScreen(sizeFrac) };
        }

        function getDitherPattern(color, densityLevel) {
            let key = `${color}_${densityLevel}`;
            if (patternCache.has(key)) return patternCache.get(key);
            let oc = document.createElement('canvas'); oc.width = 8; oc.height = 8;
            let octx = oc.getContext('2d', {alpha: true});
            octx.fillStyle = color;
            for(let y=0; y<8; y++) {
                for(let x=0; x<8; x++) { if (bayer8x8[y*8 + x] < densityLevel) octx.fillRect(x, y, 1, 1); }
            }
            let pat = ctx.createPattern(oc, 'repeat');
            patternCache.set(key, pat);
            return pat;
        }

        function getNodeAtScreen(screenX, screenY) {
            let wy_frac = applyOffset(state.camY_frac, screenY - state.height / 2);
            let dStart = 1; let foundCol = false; let cxFrac;
            
            while (dStart < 1000) {
                cxFrac = getColXFrac(dStart);
                let sX = fracToScreenX(cxFrac) + (dStart - 1) * state.gapPx;
                let sW = sizeToScreen(getBlockSizeFrac(dStart));
                if (screenX >= sX && screenX <= sX + sW) { foundCol = true; break; }
                if (screenX < sX) break; 
                dStart++;
            }

            if (!foundCol || wy_frac < 0n || wy_frac >= P_MULT) return null;

            const maxRows = 1n << BigInt(dStart); 
            const idx = wy_frac / getBlockSizeFrac(dStart);

            if (idx >= 0n && idx < maxRows) return { depth: dStart, index: idx };
            return null;
        }

        // --- FAST LOGIC HELPERS ---
        function getBitLength(n) { return n === 0n ? 1 : n.toString(2).length; }
        function getIdealAncestorFast(b) { let c = b[0]; for(let i=1;i<b.length;i++){ if(b[i]!==b[i-1])c+=b[i]; } return c; }
        function getRunsFast(b) {
            let runs = []; let count = 1; let len = b.length;
            for (let i = 1; i < len; i++) { if (b[i] === b[i-1]) count++; else { runs.push(count); count = 1; } }
            runs.push(count); return { firstBit: b[0], runs };
        }
        function runsToBin(fb, runs) {
            let b = ''; let bit = fb;
            for (let i = 0; i < runs.length; i++) { b += bit.repeat(runs[i]); bit = bit === '1' ? '0' : '1'; }
            return b;
        }
        function duplicateRunAt(binStr, runIndex) {
            let r = getRunsFast(binStr);
            let newRuns = [...r.runs];
            newRuns[runIndex]++;
            return runsToBin(r.firstBit, newRuns);
        }

        // --- INIT & EVENTS ---
        function init() { resize(); window.addEventListener('resize', resize); setupInput(); requestAnimationFrame(loop); }

        function resize() {
            state.width = window.innerWidth; state.height = window.innerHeight;
            canvas.width = state.width; canvas.height = state.height;
            ctx.imageSmoothingEnabled = false; 
            const rect = document.getElementById('waveform-panel').getBoundingClientRect();
            waveCanvas.width = rect.width || 300; waveCanvas.height = rect.height || 100; 
            waveCtx.imageSmoothingEnabled = false; drawWaveform();
        }

        function focusNode(depth, val) {
            let targetScreenSize = Math.min(state.width, state.height) * 0.15;
            let blockSizeFrac = getBlockSizeFrac(depth);
            let baseWorldSize = (Number(blockSizeFrac) / Number(P_MULT)) * BASE_SIZE;
            
            state.zoom = Math.max(0.1, Math.min(targetScreenSize / baseWorldSize, 1e100));
            let centerFracX = getColXFrac(depth) + blockSizeFrac / 2n;
            let centerFracY = getBlockYFrac(val, depth) + blockSizeFrac / 2n;
            
            let gapOffsetFrac = applyOffset(0n, (depth - 1) * state.gapPx);
            state.camX_frac = centerFracX + gapOffsetFrac; state.camY_frac = centerFracY;
        }

        function setupInput() {
            // UI Toggles & Search
            document.getElementById('btn-toggle-ui').addEventListener('click', () => {
                document.getElementById('ui-layer').classList.toggle('collapsed');
                setTimeout(resize, 350);
            });
            document.getElementById('btn-mode-linear').onclick = () => { state.mode = 'linear'; updateModeUI(); };
            document.getElementById('btn-mode-genealogy').onclick = () => { state.mode = 'genealogy'; updateModeUI(); };
            document.getElementById('btn-mode-family').onclick = () => { state.mode = 'family'; updateModeUI(); };
            document.getElementById('btn-toggle-sankey').onclick = (e) => { state.showLines = !state.showLines; e.target.className = state.showLines ? 'active' : ''; };
            
            const gapInput = document.getElementById('gapInput');
            const updateGap = (val) => { let v = Math.max(0, Math.min(256, parseInt(val) || 0)); gapInput.value = v; state.gapPx = v; };
            gapInput.addEventListener('change', e => updateGap(e.target.value));
            document.getElementById('btn-gap-dec').onclick = () => updateGap(state.gapPx - 1);
            document.getElementById('btn-gap-inc').onclick = () => updateGap(state.gapPx + 1);
            
            document.getElementById('btn-search').onclick = handleSearch;
            document.getElementById('searchInput').addEventListener('keypress', e => { if(e.key === 'Enter') handleSearch(); });
            document.getElementById('btn-ancestor').onclick = goToAncestor;

            // --- Branch View Logic ---
            const branchModal = document.getElementById('branch-modal');
            const btnOpenBranch = document.getElementById('btn-open-branch');
            const btnCloseBranch = document.getElementById('btn-close-branch');
            const btnCalcBranch = document.getElementById('btn-calc-branch');
            const branchInput = document.getElementById('branch-root-input');
            const branchError = document.getElementById('branch-error');
            const branchResults = document.getElementById('branch-results');

            btnOpenBranch.onclick = () => {
                branchModal.style.display = 'flex';
                // Auto-fill from selected node if it's an alternating root
                if (state.activeRoot) {
                    let activeBin = BigInt(state.activeRoot.index).toString(2).padStart(state.activeRoot.depth, '0');
                    if (activeBin === getIdealAncestorFast(activeBin)) {
                        branchInput.value = activeBin;
                    }
                }
            };
            btnCloseBranch.onclick = () => branchModal.style.display = 'none';

            btnCalcBranch.onclick = () => {
                branchError.textContent = '';
                branchResults.innerHTML = '';
                let rootStr = branchInput.value.trim();

                if (!/^[01]+$/.test(rootStr)) {
                    branchError.textContent = "Please enter a valid binary string.";
                    return;
                }

                for(let i = 1; i < rootStr.length; i++) {
                    if (rootStr[i] === rootStr[i-1]) {
                        branchError.textContent = "Root must consist of alternating bits (e.g., 0, 1, 10, 0101).";
                        return;
                    }
                }

            // Mouse Wheel Zoom (Desktop)
            canvas.addEventListener('wheel', e => {

        function clearSelection() {

        function goToAncestor() {

        function updateModeUI() {

        function generateTree(root) {

            const rootVal = BigInt(root.index); const bin = rootVal.toString(2).padStart(root.depth, '0');

            let curV = rootVal, curD = root.depth;

        function computeNodeData(val, d) {
            const bin = val.toString(2).padStart(d, '0');
            const isTop = bin[0] === '0'; 
            let p = 0; for(let i=0; i<d; i++) { if (bin[i] === '1') p++; }

            if (state.mode === 'family') {

            }

                        if (isAnc) { col0 = isTop ? '#aa0022' : '#ff0033'; col1 = isTop ? '#009933' : '#00ff66'; }

                if (isPrimary) { col0 = isTop ? '#aa0022' : '#ff0033'; col1 = isTop ? '#009933' : '#00ff66'; }

        function loop() { updateHover(); draw(); requestAnimationFrame(loop); }

        function updateHover() {

        function clearTooltipData() {

            document.getElementById('tt-family').textContent = '-';

        function draw() {
            ctx.fillStyle = '#1a1a1a'; ctx.fillRect(0, 0, state.width, state.height);
            let dStart = 1; 
            while (dStart < 1000) { 
                let sX = fracToScreenX(getColXFrac(dStart)) + (dStart - 1) * state.gapPx;
                let sW = sizeToScreen(getBlockSizeFrac(dStart));
                if (sX + sW > 0) break; 
                dStart++; 
            }
            
            let dynamicEdges = [];
            let yTopScr = Math.max(0, fracToScreenY(0n)); let yBotScr = Math.min(state.height, fracToScreenY(P_MULT));
            let colGrad = null;
            if (yBotScr > yTopScr) {

                let frac0 = Math.max(0, Math.min(1, Number(screenYToFrac(yTopScr)) / Number(P_MULT)));
                let frac1 = Math.max(0, Math.min(1, Number(screenYToFrac(yBotScr)) / Number(P_MULT)));

                let screenX = Math.floor(fracToScreenX(colXFrac)) + (d - 1) * state.gapPx;

                    }

                let wTop_frac = applyOffset(state.camY_frac, -state.height / 2);
                let wBot_frac = applyOffset(state.camY_frac, state.height / 2);
                let iStart = wTop_frac / blockSizeFrac; let iEnd = wBot_frac / blockSizeFrac + 1n;
                const maxRows = 1n << BigInt(d);

                for (let i = 0; i < count; i++) {

                    const screenY = Math.floor(fracToScreenY(blockYFrac));
                    const size = Math.ceil(screenBlockSize); const cellSize = size / d;

                    if (!nData) { nData = computeNodeData(val, d); state.nodeCache.set(cacheKey, nData); }

                    if (state.showLines && nData.edges.length > 0) dynamicEdges.push(...nData.edges);

                    ctx.fillStyle = nData.col0; ctx.fillRect(screenX, screenY, size, size);

                ctx.shadowBlur = 0;

                    let rightNode = e.d1 < e.d2 ? getScreenPos(e.d2, e.val2) : getScreenPos(e.d1, e.val1);
                    
                    let x1 = Math.floor(leftNode.x + leftNode.size / 2);

                    let x2 = Math.floor(rightNode.x - rightNode.size / 2);

        function drawWaveform() {
            if (state.mode !== 'linear') return;
            const w = waveCanvas.width, h = waveCanvas.height; waveCtx.clearRect(0,0,w,h);
            if (state.waveform.length === 0) return;
            waveCtx.strokeStyle = 'rgba(0, 255, 102, 0.3)'; waveCtx.lineWidth = 1;
            waveCtx.setLineDash([5, 5]); waveCtx.beginPath(); waveCtx.moveTo(0, 10); waveCtx.lineTo(w, 10); waveCtx.stroke();
            waveCtx.setLineDash([]);
            waveCtx.beginPath(); waveCtx.strokeStyle = 'var(--complement-ui)'; waveCtx.lineWidth = 2;
            const numPoints = state.waveform.length; const maxLog = Math.log(numPoints + 1);
            state.waveform.forEach((complexity, i) => {
                const px = Math.floor((Math.log(i + 2) / maxLog) * w); 
                const py = Math.floor(h - (complexity * (h - 20)) - 10); 
                if (i===0) waveCtx.moveTo(px, py); else waveCtx.lineTo(px, py);
            });
            waveCtx.stroke();
            waveCtx.fillStyle = '#fff';
            state.waveform.forEach((complexity, i) => {
                const px = Math.floor((Math.log(i + 2) / maxLog) * w); 
                const py = Math.floor(h - (complexity * (h - 20)) - 10);
                waveCtx.beginPath(); waveCtx.arc(px, py, 3, 0, Math.PI*2); waveCtx.fill();
            });
        }
        init();
    </script>
</body>
</html>
