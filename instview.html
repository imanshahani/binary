<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Executable Matrix Viewer - Golden Ratio LOD Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- Base and Layout --- */
        :root {
            --bg-color: #f4f7fa;
            --panel-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-primary: #1a202c;
            --text-secondary: #4a5568;
            --accent-color: #4299e1;
            --accent-color-hover: #3182ce;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            font-family: var(--font-family);
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: row;
            background-color: var(--panel-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.07), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            width: 100%;
            max-width: 1600px;
            margin: 20px;
            height: calc(100vh - 40px);
        }

        /* --- Controls Panel --- */
        .controls {
            width: 360px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
        }

        .controls-header {
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .controls-header h1 {
            font-size: 1.35rem;
            margin: 0 0 8px 0;
            font-weight: 700;
        }

        .controls-header p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .controls-body {
            padding: 24px;
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* --- Display Panel --- */
        .display {
            flex-grow: 1;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow: hidden;
        }

        .display-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            flex-shrink: 0;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .display-header h2 {
            font-size: 1.25rem;
            margin: 0;
            font-weight: 600;
            color: var(--text-primary);
        }

        .canvas-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #edf2f7;
            border-radius: 8px;
            position: relative;
        }

        #fractalCanvas {
            background-color: #333333;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        /* --- UI Components --- */
        label, h3 {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            font-size: 0.875rem;
            display: block;
        }

        .input-group { display: flex; flex-direction: column; }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            background-color: #f9fafb;
            cursor: pointer;
            box-sizing: border-box;
        }

        select {
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: #fff;
            font-family: var(--font-family);
            cursor: pointer;
            font-size: 0.85rem;
        }

        .checkbox-container {
            display: flex; align-items: center; cursor: pointer;
            font-size: 0.9rem; color: var(--text-secondary);
            user-select: none; margin-bottom: 6px; flex-grow: 1;
        }
        .checkbox-container input[type="checkbox"] { display: none; }
        .checkmark {
            height: 18px; width: 18px; background-color: #fff;
            border: 2px solid var(--border-color); border-radius: 4px;
            margin-right: 10px; transition: all 0.2s; position: relative;
        }
        .checkbox-container:hover .checkmark { border-color: var(--accent-color); }
        .checkbox-container input[type="checkbox"]:checked ~ .checkmark {
            background-color: var(--accent-color); border-color: var(--accent-color);
        }
        .checkmark:after {
            content: ""; position: absolute; display: none;
            left: 5px; top: 1px; width: 4px; height: 9px;
            border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg);
        }
        .checkbox-container input[type="checkbox"]:checked ~ .checkmark:after { display: block; }

        input[type="color"] {
            -webkit-appearance: none; border: none; width: 24px; height: 24px;
            border-radius: 4px; cursor: pointer; padding: 0;
            margin-left: 8px; margin-right: 12px; background: none;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 1px solid rgba(0,0,0,0.2); border-radius: 4px; }

        .legend-box {
            display: flex; flex-direction: column; gap: 8px;
            background: #f9fafb; padding: 16px; border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .channel-row { display: flex; align-items: center; }

        .info-section p, .status-section p {
            margin: 0; padding: 10px 14px; background-color: #f4f7fa;
            border-radius: 6px; font-size: 0.85rem; color: var(--text-secondary);
            word-break: break-all;
        }

        .action-btn {
            padding: 8px 16px; font-size: 0.875rem; font-weight: 600;
            border-radius: 6px; border: none; cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            background-color: #fff; color: var(--text-primary); border: 1px solid var(--border-color);
        }
        .action-btn:active { transform: scale(0.98); }
        .action-btn:hover:not(.primary) { background-color: #f9fafb; }
        .action-btn.primary { background-color: var(--accent-color); color: #fff; border-color: var(--accent-color); }
        .action-btn.primary:hover { background-color: var(--accent-color-hover); }

        /* --- Zoom Controls --- */
        .zoom-controls { display: flex; align-items: center; gap: 8px; }
        .zoom-controls span { font-size: 0.9rem; color: var(--text-secondary); font-weight: 500; min-width: 130px; }
        .zoom-btn, .zoom-presets button {
            padding: 8px 16px; border: 1px solid var(--border-color);
            background-color: #fff; border-radius: 6px; cursor: pointer; font-size: 0.875rem;
        }
        .zoom-btn:hover, .zoom-presets button:hover { background-color: #f9fafb; }
        .zoom-presets { display: flex; gap: 4px; margin-left: 8px; }
        .export-group { display: flex; gap: 8px; align-items: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <div class="controls-header">
                <h1>Universal Matrix</h1>
                <p>Disk-Streaming LOD Engine</p>
            </div>

            <div class="controls-body">
                <div class="input-group">
                    <label for="parseModeSelect">Parsing Engine</label>
                    <select id="parseModeSelect">
                        <option value="binary">Artificial Binary (Raw Bytes)</option>
                        <option value="dna">Biological Sequence (A,C,G,T)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="dataFile">Upload Huge File (Unrestricted Size)</label>
                    <input type="file" id="dataFile">
                </div>

                <div class="legend-box">
                    <h3>Channel Isolation & Colors</h3>
                    <div class="channel-row">
                        <label class="checkbox-container"><input type="checkbox" id="toggleA" class="channel-toggle" checked><span class="checkmark"></span> Ch 0 (A / 00)</label>
                        <input type="color" id="colorPickerA" class="color-picker" value="#000000">
                    </div>
                    <div class="channel-row">
                        <label class="checkbox-container"><input type="checkbox" id="toggleC" class="channel-toggle" checked><span class="checkmark"></span> Ch 1 (C / 01)</label>
                        <input type="color" id="colorPickerC" class="color-picker" value="#ff0000">
                    </div>
                    <div class="channel-row">
                        <label class="checkbox-container"><input type="checkbox" id="toggleG" class="channel-toggle" checked><span class="checkmark"></span> Ch 2 (G / 10)</label>
                        <input type="color" id="colorPickerG" class="color-picker" value="#00ff00">
                    </div>
                    <div class="channel-row">
                        <label class="checkbox-container"><input type="checkbox" id="toggleT" class="channel-toggle" checked><span class="checkmark"></span> Ch 3 (T / 11)</label>
                        <input type="color" id="colorPickerT" class="color-picker" value="#0000ff">
                    </div>
                </div>

                 <div class="info-section">
                    <p id="sequenceLengthLabel">Sequence Length: 0 units</p>
                    <p id="matrixSizeLabel">Virtual Matrix: 0 x 0</p>
                </div>

                <div class="status-section">
                    <p id="statusLabel">Status: Waiting for file...</p>
                </div>
            </div>
        </div>

        <div class="display">
             <div class="display-header">
                <h2 id="imageTitleLabel">Viewport View</h2>
                <div class="zoom-controls">
                    <span id="zoomLabel">Zoom: 1x (100%)</span>
                    <button id="zoomOutBtn" class="zoom-btn">Zoom Out</button>
                    <button id="zoomInBtn" class="zoom-btn">Zoom In</button>
                    <div class="zoom-presets">
                        <button id="zoom100Btn">1:1</button>
                        <button id="zoomFitBtn">Fit</button>
                    </div>
                </div>
                <div class="export-group">
                    <select id="exportScaleSelect">
                        <optgroup label="Viewport">
                            <option value="viewport">Viewport View</option>
                        </optgroup>
                        <optgroup label="Fixed Bounds (Streaming)">
                            <option value="fixed_1024">Fixed 1024x1024</option>
                            <option value="fixed_2048">Fixed 2048x2048</option>
                            <option value="fixed_4096">Fixed 4096x4096</option>
                            <option value="fixed_8192">Fixed 8192x8192</option>
                        </optgroup>
                    </select>
                    <button id="exportImageButton" class="action-btn primary">Export</button>
                </div>
            </div>
            <div class="canvas-container" id="canvasContainer">
                <canvas id="fractalCanvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        const App = {
            dataFile: null,
            sequenceLength: 0,
            isBinaryMode: true,
            lods: {}, 
            MIN_LOD_LEVEL: 8, 
            
            zoomLevel: 0,
            panOffsetX: 0.0,
            panOffsetY: 0.0,
            isPanning: false,
            panStartX: 0,
            panStartY: 0,
            panStartOffsetX: 0,
            panStartOffsetY: 0,
            
            MAX_ZOOM_LEVEL: 6,
            MIN_ZOOM_LEVEL: -40,
            
            colorLUT: new Float32Array(16 * 3),
            isRendering: false,
            renderPending: false,

            PURE_COLORS: [[0, 0, 0], [255, 0, 0], [0, 255, 0], [0, 0, 255]],

            init() {
                this.canvas = document.getElementById('fractalCanvas');
                this.ctx = this.canvas.getContext('2d', { alpha: false });
                this.container = document.getElementById('canvasContainer');
                
                this.syncColorsFromUI();
                this.precomputeLUT(0);
                this.bindEvents();
                this.onResize();
            },

            hexToRgb(hex) {
                const bigint = parseInt(hex.substring(1), 16);
                return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
            },

            syncColorsFromUI() {
                this.PURE_COLORS[0] = this.hexToRgb(document.getElementById('colorPickerA').value);
                this.PURE_COLORS[1] = this.hexToRgb(document.getElementById('colorPickerC').value);
                this.PURE_COLORS[2] = this.hexToRgb(document.getElementById('colorPickerG').value);
                this.PURE_COLORS[3] = this.hexToRgb(document.getElementById('colorPickerT').value);
            },

            precomputeLUT(firstVal) {
                const toggles = [
                    document.getElementById('toggleA').checked,
                    document.getElementById('toggleC').checked,
                    document.getElementById('toggleG').checked,
                    document.getElementById('toggleT').checked
                ];

                for (let valR = 0; valR < 4; valR++) {
                    for (let valC = 0; valC < 4; valC++) {
                        let rSum = 0, gSum = 0, bSum = 0, activeCount = 0;
                        
                        for(let t = 0; t < 4; t++) {
                            if (toggles[t] && ((valC === t) ^ (valR === t) ^ (firstVal === t))) {
                                rSum += this.PURE_COLORS[t][0];
                                gSum += this.PURE_COLORS[t][1];
                                bSum += this.PURE_COLORS[t][2];
                                activeCount++;
                            }
                        }

                        const idx = (valR * 4 + valC) * 3;
                        if (activeCount === 0) {
                            this.colorLUT[idx] = 237; this.colorLUT[idx + 1] = 242; this.colorLUT[idx + 2] = 247;
                        } else {
                            this.colorLUT[idx] = rSum / activeCount;
                            this.colorLUT[idx + 1] = gSum / activeCount;
                            this.colorLUT[idx + 2] = bSum / activeCount;
                        }
                    }
                }
            },

            bindEvents() {
                document.getElementById('dataFile').addEventListener('change', (e) => this.handleFileUpload(e));
                
                document.querySelectorAll('.channel-toggle, .color-picker').forEach(el => {
                    el.addEventListener('change', () => {
                        this.syncColorsFromUI();
                        this.precomputeLUT(0);
                        this.triggerRender();
                    });
                });
                
                this.canvas.addEventListener('mousedown', (e) => this.onPanStart(e));
                window.addEventListener('mousemove', (e) => this.onPanMove(e));
                window.addEventListener('mouseup', () => this.onPanEnd());
                
                this.canvas.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const rect = this.canvas.getBoundingClientRect();
                    const levelChange = e.deltaY < 0 ? 1 : -1;
                    this.setZoomLevel(this.zoomLevel + levelChange, e.clientX - rect.left, e.clientY - rect.top);
                });

                document.getElementById('zoomInBtn').addEventListener('click', () => this.setZoomLevel(this.zoomLevel + 1));
                document.getElementById('zoomOutBtn').addEventListener('click', () => this.setZoomLevel(this.zoomLevel - 1));
                document.getElementById('zoom100Btn').addEventListener('click', () => this.setZoomLevel(0));
                document.getElementById('zoomFitBtn').addEventListener('click', () => this.zoomFit());
                document.getElementById('exportImageButton').addEventListener('click', () => this.exportImage());

                new ResizeObserver(() => this.onResize()).observe(this.container);
            },

            setStatus(msg) { document.getElementById('statusLabel').textContent = `Status: ${msg}`; },

            // --- File Linking & LOD Worker ---
            handleFileUpload(event) {
                const file = event.target.files[0];
                if (!file) return;

                this.dataFile = file;
                this.isBinaryMode = document.getElementById('parseModeSelect').value === 'binary';
                
                this.sequenceLength = this.isBinaryMode ? file.size * 4 : file.size; 
                this.lods = {};
                
                document.getElementById('sequenceLengthLabel').textContent = `Sequence Length: ${this.sequenceLength.toLocaleString()} units`;
                document.getElementById('matrixSizeLabel').textContent = `Virtual Matrix: ${this.sequenceLength.toLocaleString()} x ${this.sequenceLength.toLocaleString()}`;
                
                this.zoomFit();
                this.initLODWorker(file);
            },

            initLODWorker(file) {
                const workerCode = `
                    self.onmessage = async function(e) {
                        const { file, minLod, isBinaryMode } = e.data;
                        const seqLen = isBinaryMode ? file.size * 4 : file.size;
                        const lods = {};
                        
                        let maxLod = minLod;
                        while ((seqLen / Math.pow(2, maxLod)) > 2) { maxLod++; }

                        for(let k = minLod; k <= maxLod; k++) {
                            lods[k] = new Uint8Array(Math.ceil(seqLen / Math.pow(2, k)));
                        }

                        const CHUNK_SIZE = 1024 * 1024 * 16; 
                        const totalChunks = Math.ceil(file.size / CHUNK_SIZE);

                        for (let c = 0; c < totalChunks; c++) {
                            const startByte = c * CHUNK_SIZE;
                            const endByte = Math.min(startByte + CHUNK_SIZE, file.size);
                            const blob = file.slice(startByte, endByte);
                            const buffer = await blob.arrayBuffer();
                            const bytes = new Uint8Array(buffer);

                            if (isBinaryMode) {
                                const startUnit = startByte * 4;
                                const endUnit = endByte * 4 - 1;
                                for(let k = minLod; k <= maxLod; k++) {
                                    const step = Math.pow(2, k);
                                    let firstUnit = Math.ceil(startUnit / step) * step;
                                    
                                    // Golden Ratio Offset - deterministic, non-harmonic intersection
                                    const offset = Math.floor(step * 0.61803398875);
                                    
                                    for (let u = firstUnit; u <= endUnit; u += step) {
                                        let sampleU = u + offset;
                                        if (sampleU > endUnit) sampleU = endUnit; 

                                        const b = bytes[Math.floor((sampleU - startUnit) / 4)];
                                        lods[k][u / step] = (b >> (6 - ((sampleU % 4) * 2))) & 3;
                                    }
                                }
                            } else {
                                const startUnit = startByte;
                                const endUnit = endByte - 1;
                                for(let k = minLod; k <= maxLod; k++) {
                                    const step = Math.pow(2, k);
                                    let firstUnit = Math.ceil(startUnit / step) * step;
                                    
                                    const offset = Math.floor(step * 0.61803398875);
                                    
                                    for (let u = firstUnit; u <= endUnit; u += step) {
                                        let sampleU = u + offset;
                                        if (sampleU > endUnit) sampleU = endUnit;
                                        
                                        const charCode = bytes[sampleU - startUnit];
                                        let val = 0; 
                                        if (charCode === 67 || charCode === 99) val = 1; 
                                        else if (charCode === 71 || charCode === 103) val = 2; 
                                        else if (charCode === 84 || charCode === 116) val = 3; 
                                        lods[k][u / step] = val;
                                    }
                                }
                            }

                            if (c % 4 === 0 || c === totalChunks - 1) {
                                self.postMessage({ type: 'progress', percent: Math.round(((c + 1) / totalChunks) * 100) });
                            }
                        }
                        self.postMessage({ type: 'done', lods: lods });
                    };
                `;
                
                const blob = new Blob([workerCode], { type: 'application/javascript' });
                const worker = new Worker(URL.createObjectURL(blob));

                this.setStatus("Building LOD Mipmaps...");
                worker.onmessage = (e) => {
                    if (e.data.type === 'progress') {
                        this.setStatus(`Caching Memory LODs... ${e.data.percent}%`);
                    } else if (e.data.type === 'done') {
                        this.lods = e.data.lods;
                        this.setStatus("File Linked & Mipmaps Ready.");
                        this.triggerRender(); 
                    }
                };
                worker.postMessage({ file: file, minLod: this.MIN_LOD_LEVEL, isBinaryMode: this.isBinaryMode });
            },

            // --- Async On-Demand Data Fetcher ---
            async fetchSequenceRange(startGlobal, zoomLevel, pixelCount) {
                const result = new Uint8Array(pixelCount);
                if (this.sequenceLength === 0 || !this.dataFile) return result;

                const scale = Math.pow(2, zoomLevel);
                let step = scale < 1.0 ? 1 / scale : 1;

                if (zoomLevel < 0) {
                    const k = Math.floor(Math.log2(step));
                    if (k >= this.MIN_LOD_LEVEL && this.lods[k]) {
                        const lodArr = this.lods[k];
                        const lodStep = Math.pow(2, k);
                        const startLodIdx = Math.floor(startGlobal / lodStep);
                        for(let i = 0; i < pixelCount; i++) {
                            const lodIdx = startLodIdx + Math.floor((i * step) / lodStep);
                            if (lodIdx >= 0 && lodIdx < lodArr.length) result[i] = lodArr[lodIdx];
                        }
                        return result;
                    }
                }

                // If zooming in (scale >= 1.0), offset is 0 to preserve pixel-perfect accuracy.
                const offset = scale < 1.0 ? Math.floor(step * 0.61803398875) : 0;
                
                const startUnit = Math.max(0, Math.floor(startGlobal));
                const endUnit = Math.min(this.sequenceLength - 1, Math.floor(startGlobal + (pixelCount - 1) * step + offset));
                if (startUnit > endUnit) return result;

                const startByte = this.isBinaryMode ? Math.floor(startUnit / 4) : startUnit;
                const endByte = this.isBinaryMode ? Math.floor(endUnit / 4) : endUnit;

                const blob = this.dataFile.slice(startByte, endByte + 1);
                const buffer = await blob.arrayBuffer();
                const bytes = new Uint8Array(buffer);

                for(let i = 0; i < pixelCount; i++) {
                    const chunkStart = Math.floor(startGlobal + i * step);
                    let u = chunkStart + offset;
                    
                    if (u >= this.sequenceLength) u = this.sequenceLength - 1;
                    
                    if (u >= 0 && u < this.sequenceLength) {
                        if (this.isBinaryMode) {
                            const b = bytes[Math.floor((u - startUnit) / 4)];
                            if (b !== undefined) result[i] = (b >> (6 - ((u % 4) * 2))) & 3;
                        } else {
                            const charCode = bytes[u - startUnit];
                            if (charCode !== undefined) {
                                let val = 0;
                                if (charCode === 67 || charCode === 99) val = 1;
                                else if (charCode === 71 || charCode === 103) val = 2;
                                else if (charCode === 84 || charCode === 116) val = 3;
                                result[i] = val;
                            }
                        }
                    }
                }
                return result;
            },

            // --- Viewport Controls ---
            setZoomLevel(newLevel, pivotX, pivotY) {
                if(!this.dataFile) return;
                newLevel = Math.max(this.MIN_ZOOM_LEVEL, Math.min(newLevel, this.MAX_ZOOM_LEVEL));
                if (newLevel === this.zoomLevel) return;

                const oldScale = Math.pow(2, this.zoomLevel);
                const newScale = Math.pow(2, newLevel);
                
                pivotX = pivotX !== undefined ? pivotX : this.canvas.width / 2;
                pivotY = pivotY !== undefined ? pivotY : this.canvas.height / 2;

                const centerMatrixX = this.panOffsetX + pivotX / oldScale;
                const centerMatrixY = this.panOffsetY + pivotY / oldScale;

                this.zoomLevel = newLevel;
                this.panOffsetX = centerMatrixX - pivotX / newScale;
                this.panOffsetY = centerMatrixY - pivotY / newScale;

                this.updateUI();
                this.triggerRender();
            },

            zoomFit() {
                if (this.sequenceLength === 0) return;
                const minScale = Math.min(this.canvas.width / this.sequenceLength, this.canvas.height / this.sequenceLength);
                const fitLevel = Math.floor(Math.log2(minScale));
                
                this.zoomLevel = fitLevel;
                const scale = Math.pow(2, fitLevel);
                
                this.panOffsetX = (this.sequenceLength - this.canvas.width / scale) / 2;
                this.panOffsetY = (this.sequenceLength - this.canvas.height / scale) / 2;
                
                this.updateUI();
                this.triggerRender();
            },

            onPanStart(e) {
                if(!this.dataFile) return;
                this.isPanning = true;
                this.panStartX = e.clientX;
                this.panStartY = e.clientY;
                this.panStartOffsetX = this.panOffsetX;
                this.panStartOffsetY = this.panOffsetY;
                this.canvas.style.cursor = 'grabbing';
            },

            onPanMove(e) {
                if (!this.isPanning) return;
                const scale = Math.pow(2, this.zoomLevel);
                this.panOffsetX = this.panStartOffsetX - ((e.clientX - this.panStartX) / scale);
                this.panOffsetY = this.panStartOffsetY - ((e.clientY - this.panStartY) / scale);
                this.triggerRender();
            },

            onPanEnd() {
                this.isPanning = false;
                this.canvas.style.cursor = 'crosshair';
            },

            onResize() {
                const rect = this.container.getBoundingClientRect();
                this.canvas.width = Math.floor(rect.width);
                this.canvas.height = Math.floor(rect.height);
                this.triggerRender();
            },

            updateUI() {
                const scale = Math.pow(2, this.zoomLevel);
                document.getElementById('zoomLabel').textContent = this.zoomLevel >= 0 
                    ? `Zoom: ${scale}x (${scale * 100}%)` 
                    : `Zoom: 1/${1/scale}x (${(scale * 100).toFixed(6)}%)`;
            },

            // --- Async Rendering Loop ---
            triggerRender() {
                if (this.isRendering) {
                    this.renderPending = true;
                    return;
                }
                this.renderViewport();
            },

            async renderViewport() {
                this.isRendering = true;
                const cw = this.canvas.width;
                const ch = this.canvas.height;
                
                if (this.sequenceLength === 0 || cw === 0 || ch === 0) {
                    this.ctx.fillStyle = "#edf2f7";
                    this.ctx.fillRect(0, 0, cw, ch);
                    this.isRendering = false;
                    return;
                }

                try {
                    const rowValues = await this.fetchSequenceRange(this.panOffsetY, this.zoomLevel, ch);
                    const colValues = await this.fetchSequenceRange(this.panOffsetX, this.zoomLevel, cw);

                    const imgData = this.ctx.createImageData(cw, ch);
                    const data = imgData.data;
                    const lut = this.colorLUT;

                    let i = 0;
                    for (let y = 0; y < ch; y++) {
                        const valR = rowValues[y];
                        const rActive = (Math.floor(this.panOffsetY + y / Math.pow(2, this.zoomLevel)) >= 0 && 
                                         Math.floor(this.panOffsetY + y / Math.pow(2, this.zoomLevel)) < this.sequenceLength);
                        for (let x = 0; x < cw; x++) {
                            const valC = colValues[x];
                            const cActive = (Math.floor(this.panOffsetX + x / Math.pow(2, this.zoomLevel)) >= 0 && 
                                             Math.floor(this.panOffsetX + x / Math.pow(2, this.zoomLevel)) < this.sequenceLength);
                            
                            if (rActive && cActive) {
                                const idx = (valR * 4 + valC) * 3;
                                data[i++] = lut[idx]; data[i++] = lut[idx + 1]; data[i++] = lut[idx + 2]; data[i++] = 255;
                            } else {
                                data[i++] = 237; data[i++] = 242; data[i++] = 247; data[i++] = 255;
                            }
                        }
                    }
                    this.ctx.putImageData(imgData, 0, 0);
                } finally {
                    this.isRendering = false;
                    if (this.renderPending) {
                        this.renderPending = false;
                        this.renderViewport();
                    }
                }
            },

            // --- Async Exporter ---
            async exportImage() {
                if (this.sequenceLength === 0) return;

                const exportVal = document.getElementById('exportScaleSelect').value;
                if (exportVal === "viewport") {
                    this.triggerDownload(this.canvas, "matrix_viewport.png");
                    return;
                }

                const exportSize = parseInt(exportVal.split("_")[1]);
                const scale = exportSize / this.sequenceLength;
                const tempZoomLevel = Math.log2(scale);

                this.setStatus(`Streaming & Rendering ${exportSize}x${exportSize} Image...`);
                
                try {
                    const offCanvas = document.createElement('canvas');
                    offCanvas.width = exportSize;
                    offCanvas.height = exportSize;
                    const offCtx = offCanvas.getContext('2d', { alpha: false });
                    
                    const rowValues = await this.fetchSequenceRange(0, tempZoomLevel, exportSize);
                    const colValues = await this.fetchSequenceRange(0, tempZoomLevel, exportSize);

                    const imgData = offCtx.createImageData(exportSize, exportSize);
                    const data = imgData.data;
                    const lut = this.colorLUT;

                    let i = 0;
                    for (let y = 0; y < exportSize; y++) {
                        const valR = rowValues[y];
                        for (let x = 0; x < exportSize; x++) {
                            const valC = colValues[x];
                            const idx = (valR * 4 + valC) * 3;
                            data[i++] = lut[idx]; data[i++] = lut[idx + 1]; data[i++] = lut[idx + 2]; data[i++] = 255;
                        }
                    }

                    offCtx.putImageData(imgData, 0, 0);
                    this.setStatus("Saving image file...");
                    this.triggerDownload(offCanvas, `matrix_export_${exportSize}x${exportSize}.png`);
                } catch (err) {
                    this.setStatus("Export failed.");
                    console.error("Export Error:", err);
                }
            },

            triggerDownload(canvasEl, filename) {
                canvasEl.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = filename;
                    document.body.appendChild(a); a.click(); document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    this.setStatus("Export complete.");
                }, 'image/png');
            }
        };

        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
